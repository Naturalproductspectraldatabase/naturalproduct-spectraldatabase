name: NPDB cross-PR merge rehearsal (code only)
on:
  push:
    branches: [qa/npdb-cross-pr-rehearsal-20261103]
  pull_request:
    branches: [fix/npdb-viewer-gps-redaction-20261103]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  merge-diagnostic:
    name: Exact-head ephemeral merge (no data or secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact run revision without submodules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=80 origin "refs/heads/qa/npdb-cross-pr-rehearsal-20261103"
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
      - name: Offline merge conflicts only; no DB, network app calls or production writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${AUTH}"
          bash NMR_Database_Tyas_GitHub_Upload/scripts/npdb_cross_pr_rehearsal.sh

      - name: Set up Python for combined synthetic regression
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check "streamlit==1.66.1" "plotly==7.1.0" "pandas==2.2.3" "pillow==12.3.0" "rdkit==2026.9.1"
      - name: Compile combined candidate and run ALL synthetic tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile NMR_Database_Tyas_GitHub_Upload/scripts/app.py
          python -m compileall -q NMR_Database_Tyas_GitHub_Upload/scripts
          python -m unittest discover -s NMR_Database_Tyas_GitHub_Upload/tests -p 'test_*.py' -v

      - name: Restrict integrated patch to source/test/docs/workflow code only
        run: |
          BASE="$(cat /tmp/npdb-rehearsal-base-sha)"
          git diff --name-only "$BASE" HEAD > /tmp/npdb-patched-paths.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path("/tmp/npdb-patched-paths.txt").read_text().splitlines()
          allowed=(".github/workflows/", "NMR_Database_Tyas_GitHub_Upload/scripts/",
                   "NMR_Database_Tyas_GitHub_Upload/tests/", "NMR_Database_Tyas_GitHub_Upload/docs/")
          if not paths or any(not name.startswith(allowed) or any(p in name.lower()
                            for p in (".streamlit", ".env", ".db", ".sqlite", "secret",
                                      "credentials", "/data/", "/backups/")) for name in paths):
              raise SystemExit("Unsafe changed path in integrated patch; refusing artifact.")
          print("Integrated code-only changed paths:", len(paths))
          PY
          git diff --binary "$BASE" HEAD > /tmp/npdb-integrated-code.patch
          test -s /tmp/npdb-integrated-code.patch
      - name: Package verified code diff without private data
        uses: actions/upload-artifact@v4
        with:
          name: npdb-synthetic-reviewed-code-patch
          path: /tmp/npdb-integrated-code.patch
          if-no-files-found: error
          retention-days: 1

  publish-isolated-candidate:
    name: Publish integrated source ONLY to new nonproduction branch
    needs: merge-diagnostic
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/npdb-cross-pr-rehearsal-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Download verified code patch from successful synthetic tests
        uses: actions/download-artifact@v4
        with:
          name: npdb-synthetic-reviewed-code-patch
          path: /tmp/npdb-patch
      - name: Apply patch to exact rehearsal commit and create isolated branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${AUTH}"
          git fetch --no-tags --depth=80 origin "refs/heads/qa/npdb-cross-pr-rehearsal-20261103"
          git checkout -b qa/npdb-integrated-preflight-20261103 FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git apply --check /tmp/npdb-patch/npdb-integrated-code.patch
          git apply --index /tmp/npdb-patch/npdb-integrated-code.patch
          git diff --cached --check
          git config user.name "NPDB isolated integration bot"
          git config user.email "npdb-qa@example.invalid"
          git commit -m "qa: integrate security, CAS, WAL and GPS protection (synthetic-gated)"
          if git ls-remote --exit-code origin refs/heads/qa/npdb-integrated-preflight-20261103 >/dev/null; then
            echo "Target integration branch exists: refusing overwrite."
            exit 1
          fi
          git push origin HEAD:refs/heads/qa/npdb-integrated-preflight-20261103
          echo "Published only new isolated candidate branch; QA/main and production untouched."
