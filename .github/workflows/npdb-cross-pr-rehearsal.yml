name: NPDB cross-PR merge rehearsal (code only)
on:
  push:
    branches: [qa/npdb-cross-pr-rehearsal-20261103]
  pull_request:
    branches: [fix/npdb-viewer-gps-redaction-20261103]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  merge-diagnostic:
    name: Exact-head ephemeral merge (no data or secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact run revision without submodules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=80 origin "refs/heads/qa/npdb-cross-pr-rehearsal-20261103"
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
      - name: Offline merge conflicts only; no DB, network app calls or production writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${AUTH}"
          bash NMR_Database_Tyas_GitHub_Upload/scripts/npdb_cross_pr_rehearsal.sh

      - name: Set up Python for combined synthetic regression
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check "streamlit==1.66.1" "plotly==7.1.0" "pandas==2.2.3" "pillow==12.3.0" "rdkit==2026.9.1"
      - name: Compile combined candidate and run ALL synthetic tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile NMR_Database_Tyas_GitHub_Upload/scripts/app.py
          python -m compileall -q NMR_Database_Tyas_GitHub_Upload/scripts
          python -m unittest discover -s NMR_Database_Tyas_GitHub_Upload/tests -p 'test_*.py' -v
