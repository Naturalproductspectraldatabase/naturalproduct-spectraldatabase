name: NPDB offline regression checks

on:
  pull_request:
    branches: [main, qa/npdb-reviewed-integration-20261103, qa/npdb-integrated-preflight-20261103, fix/npdb-nmr-bioactivity-disclosure-20261103, fix/npdb-stereo-aware-structure-search-20261103, qa/npdb-security-candidate-20261105]
  push:
    branches: [main, qa/npdb-cumulative-integration-20261105, fix/npdb-field-location-policy-20261105, qa/npdb-reliability-preflight-20261105, fix/npdb-field-policy-integration-20261105]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npdb-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Python ${{ matrix.python-version }} / syntax & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Fetch exact source only; exclude repository datasets and backup files
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --no-tags --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/extract_synthetic_source.py" > "$RUNNER_TEMP/npdb-extract-source.py"
          python3 "$RUNNER_TEMP/npdb-extract-source.py" "$GITHUB_SHA"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies for offline AST/data tests
        run: python -m pip install --disable-pip-version-check "pandas==2.2.3" "pillow>=10,<13" "openpyxl==3.1.5" "rdkit==2026.9.1"
      - name: Compile application and helper modules
        run: |
          python -m py_compile NMR_Database_Tyas_GitHub_Upload/scripts/app.py
          python -m compileall -q NMR_Database_Tyas_GitHub_Upload/scripts
      - name: Reproduce 16 unresolved scientific assertions in strict mode
        run: python NMR_Database_Tyas_GitHub_Upload/scripts/verify_science_round2_failures.py
      - name: Check imported browser scaffold syntax (not browser acceptance)
        run: node --check NMR_Database_Tyas_GitHub_Upload/tests/ui/npdb_uiux_acceptance.js
      - name: Generate exact-revision release declaration matrix
        run: python NMR_Database_Tyas_GitHub_Upload/scripts/npdb_release_inventory.py NMR_Database_Tyas_GitHub_Upload/scripts/app.py /tmp/release-matrix.json "$GITHUB_SHA"
      - name: Run offline regression test suite
        run: |
          python -m unittest discover -s NMR_Database_Tyas_GitHub_Upload/tests -p 'test_*.py' -v

  streamlit-login-integration:
    name: Streamlit / isolated full-script login
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact source only; exclude repository datasets and backup files
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --no-tags --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/extract_synthetic_source.py" > "$RUNNER_TEMP/npdb-extract-source.py"
          python3 "$RUNNER_TEMP/npdb-extract-source.py" "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tested UI dependencies
        run: python -m pip install "streamlit==1.66.1" "plotly==7.1.0" "pandas==2.2.3" "pillow==12.3.0"
      - name: Run synthetic login integration checks
        run: python -m unittest discover -s NMR_Database_Tyas_GitHub_Upload/tests -p 'test_streamlit_*integration.py' -v

  structure-science:
    name: RDKit / synthetic structure index and identity review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact source only; exclude repository datasets and backup files
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --no-tags --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/extract_synthetic_source.py" > "$RUNNER_TEMP/npdb-extract-source.py"
          python3 "$RUNNER_TEMP/npdb-extract-source.py" "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned chemistry test dependencies
        run: python -m pip install "rdkit==2026.9.1" "pandas==2.2.3"
      - name: Run synthetic chemistry and index regression checks
        run: python -m unittest discover -s NMR_Database_Tyas_GitHub_Upload/tests -p 'test_structure_*review.py' -v
