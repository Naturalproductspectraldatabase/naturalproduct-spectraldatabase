name: NPDB viewer GPS redaction (synthetic only)

on:
  pull_request:
    branches: [fix/npdb-backend-capabilities-20261103, qa/npdb-integrated-preflight-20261103, fix/npdb-nmr-bioactivity-disclosure-20261103, fix/npdb-stereo-aware-structure-search-20261103, qa/npdb-security-candidate-20261105]
  push:
    branches: [fix/npdb-viewer-gps-redaction-20261103, qa/npdb-cumulative-integration-20261105, fix/npdb-field-location-policy-20261105, qa/npdb-reliability-preflight-20261105, fix/npdb-field-policy-integration-20261105]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gps-privacy:
    name: Synthetic viewer privacy / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Fetch exact source only; exclude repository datasets and backup files
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --no-tags --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/extract_synthetic_source.py" > "$RUNNER_TEMP/npdb-extract-source.py"
          python3 "$RUNNER_TEMP/npdb-extract-source.py" "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated synthetic-test dependency
        run: python -m pip install --disable-pip-version-check "pandas==2.2.3" "pillow==12.3.0" "streamlit==1.66.1" "plotly==7.1.0" "openpyxl==3.1.5" "rdkit==2026.9.1"
      - name: Compile source and privacy tests
        run: |
          python -m py_compile NMR_Database_Tyas_GitHub_Upload/scripts/app.py
          python -m py_compile NMR_Database_Tyas_GitHub_Upload/tests/test_viewer_gps_redaction.py
      - name: Run synthetic viewer/export privacy tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s NMR_Database_Tyas_GitHub_Upload/tests -p 'test_viewer_gps_redaction.py' -v
      - name: Execute complete synthetic/offline application test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s NMR_Database_Tyas_GitHub_Upload/tests -p 'test_*.py' -v
