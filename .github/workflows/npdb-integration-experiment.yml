name: NPDB integration experiment (no production access)

on:
  push:
    branches: [ci/npdb-integration-lab-20261103]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-and-test:
    name: Offline integration ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core-integrity
            prs: "3 6"
          - name: core-and-images
            prs: "3 6 4"
          - name: core-and-login
            prs: "3 6 12"
          - name: all-feature-drafts
            prs: "3 6 4 7 5 8 9 12"
    steps:
      - name: Initialize isolated Git checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" fetch --no-tags --depth=1 origin "refs/heads/main"
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
          git config user.name "NPDB Offline Integration"
          git config user.email "ci@users.noreply.github.com"
      - name: Fetch and merge candidate PRs locally, never push
        env:
          GH_TOKEN: ${{ github.token }}
          PR_LIST: ${{ matrix.prs }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"
          for number in ${PR_LIST}; do
            echo "::group::Merging PR #${number} into disposable runner checkout"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" fetch --no-tags --unshallow origin "pull/${number}/head:refs/remotes/npdb-pr-${number}" || git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" fetch --no-tags origin "pull/${number}/head:refs/remotes/npdb-pr-${number}"
            git merge --no-ff --no-edit "refs/remotes/npdb-pr-${number}" || { git status --short; exit 1; }
            echo "::endgroup::"
          done
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check "pandas>=2.2,<3.1" "pillow>=10,<13"
      - name: Compile combined code
        run: |
          python -m py_compile NMR_Database_Tyas_GitHub_Upload/scripts/app.py
          python -m compileall -q NMR_Database_Tyas_GitHub_Upload/scripts
      - name: Run all combined offline regression tests
        run: python -m unittest discover -s NMR_Database_Tyas_GitHub_Upload/tests -p 'test_*.py' -v

      - name: Install Streamlit AppTest runtime
        run: python -m pip install --disable-pip-version-check "streamlit==1.66.1" "plotly>=6,<7" "openpyxl>=3.1,<4" "certifi>=2024"
      - name: Run offline Streamlit UI smoke test using bundled snapshot
        env:
          NPDB_READ_BACKEND: snapshot
          PYTHONWARNINGS: ignore
        run: |
          python - <<'PY'
          from pathlib import Path
          from streamlit.testing.v1 import AppTest
          app_file = Path("NMR_Database_Tyas_GitHub_Upload/scripts/app.py")
          test_app = AppTest.from_file(str(app_file), default_timeout=120)
          test_app.run(timeout=120)
          errors = [str(e.message) for e in test_app.exception]
          print("AppTest exceptions:", errors)
          print("Titles:", [str(t.value)[:90] for t in test_app.title][:12])
          print("Sidebar messages:", len(test_app.sidebar.markdown))
          if errors:
              raise AssertionError("Offline dashboard load raised exceptions: " + " / ".join(errors[:4]))
          print("PASS: app loaded in isolated snapshot mode; no Supabase credentials were available")
          PY

      - name: Test fail-closed login and authorized snapshot with dummy secrets
        if: matrix.name == 'core-and-login' || matrix.name == 'all-feature-drafts'
        env:
          NPDB_READ_BACKEND: snapshot
          NPDB_ACCESS_PASSWORD_HASH: "synthetic_test_hash_not_a_password"
          PYTHONWARNINGS: ignore
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          target = "NMR_Database_Tyas_GitHub_Upload/scripts/app.py"
          guest = AppTest.from_file(target,default_timeout=120).run(timeout=120)
          assert not guest.exception, [str(x.message) for x in guest.exception]
          assert len(guest.sidebar.markdown)==0, "Unauthenticated guest unexpectedly saw navigation"
          owner = AppTest.from_file(target,default_timeout=120)
          owner.session_state["npdb_authenticated"] = True
          owner.session_state["npdb_username"] = "npdb_tyas"
          owner.session_state["npdb_role"] = "owner"
          owner.run(timeout=120)
          assert not owner.exception, [str(x.message) for x in owner.exception]
          assert len(owner.sidebar.markdown)>0, "Owner session did not reach app navigation"
          print("PASS: guest blocked and synthetic authorized owner can enter snapshot dashboard")
          PY
      - name: Test multi-step wizard UI navigation with synthetic draft
        if: matrix.name == 'core-integrity' || matrix.name == 'core-and-login'
        env:
          NPDB_READ_BACKEND: snapshot
          NPDB_ACCESS_PASSWORD_HASH: "synthetic_test_hash_not_a_password"
          PYTHONWARNINGS: ignore
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          target="NMR_Database_Tyas_GitHub_Upload/scripts/app.py"
          app=AppTest.from_file(target,default_timeout=120)
          app.session_state["npdb_authenticated"]=True
          app.session_state["npdb_username"]="npdb_tyas"
          app.session_state["npdb_role"]="owner"
          app.session_state["nav_section"]="Compound Workspace"
          app.session_state["compound_page"]="New Submission"
          app.session_state["compound_wizard_step"]=1
          def no_errors(stage):
              assert not app.exception, f"{stage}: "+str([x.message for x in app.exception])
          app.run(timeout=120)
          no_errors("initial")
          assert app.session_state["compound_wizard_step"]==1
          app.text_input(key="wizard_trivial_name").set_value("SYNTHETIC-UI-TEST")
          app.button(key="wizard_next_1").click().run(timeout=120)
          no_errors("step 2")
          assert app.session_state["compound_wizard_step"]==2
          app.text_input(key="wizard_source_organism").set_value("TEST Spongia sp.")
          app.text_input(key="wizard_sample_code").set_value("DEMO-XYZ")
          app.button(key="wizard_next_2").click().run(timeout=120)
          no_errors("step 3")
          assert app.session_state["compound_wizard_step"]==3
          app.text_input(key="wizard_uv_data").set_value("TEST 210 nm")
          app.text_input(key="wizard_ftir_data").set_value("TEST 1700 cm-1")
          app.text_area(key="wizard_hrms_data").set_value("TEST m/z 500.0000")
          app.button(key="wizard_next_3").click().run(timeout=120)
          no_errors("step 4")
          assert app.session_state["compound_wizard_step"]==4
          for key,expected in {
              "wizard_source_organism":"TEST Spongia sp.",
              "wizard_sample_code":"DEMO-XYZ",
              "wizard_uv_data":"TEST 210 nm",
              "wizard_ftir_data":"TEST 1700 cm-1",
              "wizard_hrms_data":"TEST m/z 500.0000",
          }.items():
              assert app.session_state.get("_draft_"+key)==expected, (key,app.session_state.get("_draft_"+key))
          app.button(key="wizard_back_4").click().run(timeout=120)
          no_errors("back to 3")
          assert app.session_state["compound_wizard_step"]==3
          app.button(key="wizard_back_3").click().run(timeout=120)
          no_errors("back to 2")
          assert app.session_state["compound_wizard_step"]==2
          assert app.session_state.get("_draft_wizard_sample_code")=="DEMO-XYZ"
          app.button(key="wizard_next_2").click().run(timeout=120)
          no_errors("forward to 3")
          assert app.session_state.get("_draft_wizard_hrms_data")=="TEST m/z 500.0000"
          print("PASS: Synthetic Streamlit wizard persisted Origin/Spectral inputs across forward/back navigation, without save")
          PY
      - name: Publish tested core integration branch only (never production)
        if: matrix.name == 'core-integrity'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" push origin HEAD:refs/heads/qa/npdb-core-integrity-20261103
