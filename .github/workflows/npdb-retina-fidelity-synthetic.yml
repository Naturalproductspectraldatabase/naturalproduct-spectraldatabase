name: NPDB sidebar Retina fidelity (synthetic)

on:
  push:
    branches: [fix/npdb-retina-sidebar-logo-20261103, fix/npdb-branding-asset-cache-20261103, fix/npdb-structure-bundle-provenance-20261103, fix/npdb-scientific-truthfulness-20261103, fix/npdb-nmr-bioactivity-disclosure-20261103, fix/npdb-stereo-aware-structure-search-20261103, qa/npdb-cumulative-integration-20261105, fix/npdb-field-location-policy-20261105, qa/npdb-reliability-preflight-20261105, fix/npdb-field-policy-integration-20261105]
  pull_request:
    branches: [fix/npdb-pandas-deployment-envelope-20261103, fix/npdb-preflight-security-validation-20261103, fix/npdb-retina-sidebar-logo-20261103, fix/npdb-branding-asset-cache-20261103, fix/npdb-structure-bundle-provenance-20261103, fix/npdb-scientific-truthfulness-20261103, fix/npdb-nmr-bioactivity-disclosure-20261103, fix/npdb-stereo-aware-structure-search-20261103, qa/npdb-security-candidate-20261105]

permissions:
  contents: read

jobs:
  retina-and-full-regression:
    name: Synthetic Retina / full application regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch exact source only; exclude repository datasets and backup files
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          git fetch --no-tags --filter=blob:none --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git show "$GITHUB_SHA:.github/scripts/extract_synthetic_source.py" > "$RUNNER_TEMP/npdb-extract-source.py"
          python3 "$RUNNER_TEMP/npdb-extract-source.py" "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned synthetic-only test dependencies
        run: |
          python -m pip install --disable-pip-version-check "pandas==2.2.3" "Pillow==12.3.0" "streamlit==1.66.1" "plotly==7.1.0" "rdkit==2026.9.1" "openpyxl==3.1.5"
      - name: Compile combined app and synthetic pixel checks
        run: |
          python -m py_compile NMR_Database_Tyas_GitHub_Upload/scripts/app.py
          python -m py_compile NMR_Database_Tyas_GitHub_Upload/tests/test_retina_branding_resolution.py
      - name: Run synthetic Retina and full regression test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s NMR_Database_Tyas_GitHub_Upload/tests -p 'test_*.py' -v
